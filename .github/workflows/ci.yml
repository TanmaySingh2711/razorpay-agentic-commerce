# Continuous integration.
#
# Eight checks, each answering one question on a machine that has never seen
# this repository before:
#
#   Lint (eslint)                  is the code style- and architecture-clean,
#                                  formatted, and free of known-bad dependencies?
#   Type check (tsc)               does the whole program type-check strictly?
#   Tests (ubuntu/macos/windows)   does the full suite - including every
#                                  PostgreSQL test - pass on all three systems?
#   One-click setup (x3)           does `npm run setup` take a fresh clone to a
#                                  working, migrated, seeded app, and does that
#                                  app build and answer on every system?
#
# WHAT THIS WORKFLOW IS NOT ALLOWED TO REACH. No Neon, no Gemini, no Razorpay,
# no Vercel. The database in every job is a disposable PostgreSQL 17 that
# exists for the length of that job, and `tests/support/no-network.ts` fails
# any test that attempts a non-loopback request, so the isolation is enforced by
# the suite itself rather than by this file's good intentions. No secret is
# referenced here, and none is needed: every credential below belongs to that
# throwaway server and authorises nothing outside it.
#
# WHY NOT A DOCKER SERVICE CONTAINER. GitHub runs service containers on Linux
# only; macOS runners have no Docker and Windows runners cannot run Linux
# images. `ikalnytskyi/action-setup-postgres` installs the same major version
# natively on all three, so the three operating systems test the same thing.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The suite reads this and only this. DATABASE_URL and DIRECT_URL are
  # deliberately left unset: `tests/db/test-database-url.ts` refuses to fall
  # back to an application database, and there is none here to fall back to.
  # The host is localhost, which the database-target guard's allow-list already
  # accepts - no guard is relaxed to make CI work.
  TEST_DIRECT_URL: postgresql://razorpay:razorpay_local_test@localhost:5432/razorpay_agentic_test?sslmode=disable
  # Next.js otherwise asks every fresh machine whether it may collect usage.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Reads `24` from .nvmrc, so the runtime is defined in one place and
          # cannot drift from package.json's `engines` field.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (style and architecture rules)
        run: npm run lint

      - name: Prettier (formatting)
        run: npm run format:check

      - name: Audit production dependencies for high and critical advisories
        # The retry exists only for the registry being unreachable. A real
        # finding is never retried away - the verdict is read out of the JSON
        # report, so "audit succeeded and found something" and "audit could not
        # run" stay distinguishable rather than collapsing into one exit code.
        run: |
          set -uo pipefail

          # Exits 0 for a clean report, 1 for a real finding, and 2 for "there
          # is no report here", which is the only case the loop retries.
          read_report() {
            node -e '
              const fs = require("node:fs");
              let report;
              try {
                report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
              } catch {
                process.exit(2);
              }
              const found = report?.metadata?.vulnerabilities;
              if (found === undefined) process.exit(2);
              const high = Number(found.high ?? 0);
              const critical = Number(found.critical ?? 0);
              if (high > 0 || critical > 0) {
                console.log(`::error::npm audit found ${critical} critical and ${high} high advisories.`);
                process.exit(1);
              }
              console.log("No high or critical advisories in production dependencies.");
            '
          }

          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high --json > audit.json 2> audit.err

            read_report
            verdict=$?
            if [ "$verdict" -eq 0 ]; then exit 0; fi
            if [ "$verdict" -eq 1 ]; then
              npm audit --omit=dev --audit-level=high || true
              exit 1
            fi

            echo "Attempt $attempt: the npm advisory registry did not return a report."
            cat audit.err || true
            sleep $((attempt * 10))
          done

          # Three attempts, no report. That is an outage, not a finding, and
          # saying so is more honest than either failing or claiming a pass.
          echo "::warning::npm audit could not reach the advisory registry after 3 attempts; dependencies were not audited in this run."
          exit 0

  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # Its postinstall runs `prisma generate`, which needs no database.
        run: npm ci

      - name: Type check
        # `next typegen` first, so route types exist, then strict `tsc`.
        run: npm run typecheck

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One system failing must not hide whether the others pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Start a disposable PostgreSQL 17
        # Pinned to the major version .config/docker-compose.yml runs locally, so a
        # constraint, enum or unique index behaves here exactly as it does on a
        # developer machine.
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgres-version: "17"
          username: razorpay
          password: razorpay_local_test
          database: razorpay_agentic_test
          port: 5432

      - name: Install dependencies
        run: npm ci

      - name: Prepare the disposable test schema
        # The project's own script: it builds the `agentic_test` schema by
        # applying the real migrations, then stamps the marker row that the
        # suite's guard requires before it will truncate anything.
        run: npm run db:test:setup

      - name: Run the full test suite
        run: npm test

  setup:
    name: One-click setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # No npm cache on purpose: this job proves what a first-time user gets.
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Start a local PostgreSQL 17
        # Stands in for Docker Desktop, which these runners cannot provide.
        # `npm run setup` finds a server already listening and uses it, exactly
        # as it would on a developer machine with PostgreSQL installed.
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgres-version: "17"
          username: razorpay
          password: razorpay_local_test
          database: razorpay_agentic_test
          port: 5432

      # The entry points the README promises, run the way a person would: the
      # shell script on macOS and Linux, the batch file on Windows. Both check
      # for Node.js and then hand over to `npm run setup`, which installs,
      # writes .env.local, prepares the test schema, and creates, migrates and
      # seeds the development database.
      - name: ./setup.sh
        if: runner.os != 'Windows'
        run: ./setup.sh

      - name: setup.bat
        if: runner.os == 'Windows'
        shell: cmd
        run: .\setup.bat

      - name: Production build
        run: npm run build

      - name: The built app starts and answers
        shell: bash
        run: |
          set -uo pipefail
          npx next start --port 3000 > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/api/health; then
              echo
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The production server did not answer /api/health within 60 seconds."
          cat server.log
          exit 1
